<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Çaydanlık AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body, html {
            height: 100dvh;
            background-color: #0f0f0f;
            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: #1a1a1a;
            border-bottom: 2px solid #ff9500;
            flex-shrink: 0;
        }
        .header h1 { font-size: 1.4rem; color: #ff9500; letter-spacing: 2px; font-weight: bold; }
        
        .download-btn {
            background-color: #ff9500;
            color: black;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.2s;
        }
        .download-btn:hover { background-color: #e68600; transform: scale(1.05); }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user { align-self: flex-end; background-color: #ff9500; color: black; border-bottom-right-radius: 2px; }
        .message.bot { align-self: flex-start; background-color: #262626; color: white; border: 1px solid #333; border-bottom-left-radius: 2px; }

        .input-area {
            background-color: #ffffff;
            padding: 12px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            color: #000;
        }
        .input-area button {
            background-color: #ff9500;
            color: black;
            border: none;
            border-radius: 12px;
            padding: 0 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ÇAYDANLIK AI</h1>
        <a href="https://budeogretmenimsenicokseviyorum.my.canva.site/n-tr-modern-web-sitesi-yenileme-hikayeniz" target="_blank" class="download-btn">Windows İçin İndir</a>
    </div>

    <div class="chat-container" id="chatArea">
        <div class="message bot">API sistemine bağlandım. Ne sormak istersin?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Bir şey yaz..." autocomplete="off">
        <button id="sendBtn">GÖNDER</button>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            // Kullanıcı mesajı
            const uDiv = document.createElement('div');
            uDiv.className = 'message user';
            uDiv.textContent = text;
            chatArea.appendChild(uDiv);
            userInput.value = '';
            chatArea.scrollTop = chatArea.scrollHeight;

            // Bot "Düşünüyor..." efekti
            const bDiv = document.createElement('div');
            bDiv.className = 'message bot';
            bDiv.textContent = "🤔 Düşünüyor...";
            chatArea.appendChild(bDiv);
            chatArea.scrollTop = chatArea.scrollHeight;

            try {
                // API'ye istek atıyoruz
                const response = await fetch('/api/cay');
                const data = await response.json();
                
                // Cevap geldiğinde yazıyı güncelliyoruz (Yine 1.5 saniye sinir bozucu bekletmeyle)
                setTimeout(() => {
                    bDiv.textContent = data.mesaj;
                    chatArea.scrollTop = chatArea.scrollHeight;
                }, 1500);

            } catch (error) {
                bDiv.textContent = "HATA! API sunucusuna ulaşılamıyor.";
            }
        }

        sendBtn.onclick = handleSend;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
